# JellyWatcher — Docker Compose
#
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d
#   docker compose logs jellywatcher | grep "setup code"
#
# Then open http://<host>:8484 and follow the setup. Everything else is configured in the web UI.

services:
  jellywatcher:
    image: ghcr.io/tigamingtv/jellywatcher:latest   # or pin a version, e.g. :1.0.0
    # build: .                                      # instead of `image:` to build from a clone
    container_name: jellywatcher
    restart: unless-stopped
    init: true
    ports:
      - "${JW_HOST_PORT:-8484}:8484"   # host port: 8484, or JW_HOST_PORT from .env
    environment:
      TZ: ${TZ:-UTC}                # time zone, e.g. Europe/Berlin (or TZ in .env)
      # Only behind a reverse proxy (see docs/operations.md):
      # JW_PUBLIC_URL: https://watch.example.com
      # JW_TRUST_PROXY: "172.16.0.0/12"   # the proxy's address(es); "true" trusts every client
    env_file:                       # optional extra settings, see .env.example
      - path: .env
        required: false
    volumes:
      - ./data:/data                # database, encryption key, cache, logs, backups
    # Hardening: the app only writes to /data.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Jellyfin and Seerr in Compose on the same host? Join their network and use container
    # names (e.g. http://jellyfin:8096) as server URLs in Integrations:
    # networks:
    #   - media

# networks:
#   media:
#     external: true
