# JellyWatcher — example Docker Compose deployment.
#
#   cp .env.example .env      # adjust values (all optional)
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d
#   docker compose logs jellywatcher | grep "setup code"
#
# Then open http://<host>:8484 and complete the setup.

services:
  jellywatcher:
    build: .
    # Or use a published image instead of building:
    # image: ghcr.io/tigamingtv/jellywatcher:latest
    container_name: jellywatcher
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${JW_HOST_PORT:-8484}:8484"
    volumes:
      # Database, encryption key, image cache, logs and automatic pre-upgrade backups.
      - ./data:/data
    # Hardening: the app only needs to write to /data.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # If Jellyfin and Seerr run in Compose on the same host, join their network so you can use
    # container names (e.g. http://jellyfin:8096) as the server URLs in Integrations.
    # networks:
    #   - media

# networks:
#   media:
#     external: true
